name: Legacy - Cypress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy/**'

jobs:
  cypress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run cypress:run
