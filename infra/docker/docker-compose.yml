services:
  postgres:
    image: postgres:16-alpine
    container_name: whiskey-club-os-postgres
    environment:
      POSTGRES_DB: whiskey_club_os
      POSTGRES_USER: whiskey
      POSTGRES_PASSWORD: whiskey
    ports:
      - "5432:5432"
    volumes:
      - whiskey_club_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiskey -d whiskey_club_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whiskey_club_os_pgdata:
